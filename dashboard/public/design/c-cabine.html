<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direção C · Cabine de Controle</title>
<style>
  /* Painel físico de sala de controle: grafite, amarelo de segurança, lâmpadas. Despachar = levantar a tampa e virar a chave. */
  :root{--body:#171a18;--panel:#232723;--panel2:#2c312c;--edge:#0c0e0c;--yellow:#ffd60a;--red:#ef3b2d;--green:#3ddc84;--amber:#ffab1a;--paper:#f6f4ec;--ink:#151515;--mute:#8e988e;
        --f:Bahnschrift,"Arial Narrow",Arial,sans-serif;--mono:Consolas,monospace}
  *{box-sizing:border-box;margin:0}
  body{background:var(--body);color:#e8ece6;font-family:var(--f);min-height:100vh;padding:14px}
  .rack{border:4px solid var(--edge);border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 2px #3a403a;min-height:calc(100vh - 28px);display:grid;grid-template-rows:auto 1fr}
  .screw{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a918a,#2a2d2a);box-shadow:0 0 0 1px #000}
  /* anunciadores */
  .ann{display:flex;gap:10px;align-items:stretch;padding:12px 14px;border-bottom:3px solid var(--edge);background:var(--panel2);flex-wrap:wrap}
  .lamp{display:flex;align-items:center;gap:9px;padding:7px 12px;background:#101310;border:2px solid #000;border-radius:4px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .lamp i{width:14px;height:14px;border-radius:50%;background:#333;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
  .lamp.g i{background:var(--green);box-shadow:0 0 10px var(--green)}
  .lamp.a i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .lamp.r i{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1s steps(2) infinite}
  .lamp.off i{background:#333;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
  .ann .title{margin-right:auto;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--yellow);font-stretch:condensed;align-self:center}
  .keysw{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .keysw .pos{background:#101310;border:2px solid #000;border-radius:4px;padding:6px 10px;display:flex;gap:8px}
  .keysw .on{color:#111;background:var(--yellow);padding:1px 6px;border-radius:2px;font-weight:700}
  .keysw .lockedpos{opacity:.4;text-decoration:line-through}
  @keyframes blink{50%{opacity:.35}}
  .work{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.4fr);gap:14px;padding:14px}
  /* impressora / fila */
  .printer{background:var(--panel2);border:3px solid var(--edge);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .slot{height:10px;background:#000;border-radius:4px;box-shadow:inset 0 3px 5px #000}
  .strip{background:var(--paper);color:var(--ink);border:0;text-align:left;padding:10px 12px 14px;font-family:var(--mono);cursor:pointer;position:relative;
         clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),96% 100%,92% calc(100% - 6px),88% 100%,84% calc(100% - 6px),80% 100%,76% calc(100% - 6px),72% 100%,68% calc(100% - 6px),64% 100%,60% calc(100% - 6px),56% 100%,52% calc(100% - 6px),48% 100%,44% calc(100% - 6px),40% 100%,36% calc(100% - 6px),32% 100%,28% calc(100% - 6px),24% 100%,20% calc(100% - 6px),16% 100%,12% calc(100% - 6px),8% 100%,4% calc(100% - 6px),0 100%);
         transition:transform .15s}
  .strip:hover{transform:translateX(6px)}
  .strip.sel{background:var(--yellow);transform:translateX(12px)}
  .strip .id{font-weight:700;font-size:12px}
  .strip .t{font-family:var(--f);font-size:18px;font-weight:800;font-stretch:condensed;text-transform:uppercase;line-height:1.05;margin:2px 0}
  .strip .m{font-size:11px;opacity:.75}
  .strip.gone{display:none}
  /* mesa */
  .desk{background:var(--panel2);border:3px solid var(--edge);border-radius:6px;padding:14px;display:grid;gap:12px;align-content:start}
  .lcd{background:#0b1a10;color:#7dff9d;border:3px solid #000;border-radius:4px;padding:12px 14px;font-family:var(--mono);text-shadow:0 0 6px rgba(125,255,157,.6);min-height:132px}
  .lcd .big{font-size:34px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
  .lcd .sm{font-size:12px;opacity:.85;margin-top:8px;line-height:1.5}
  .lcd.bad{background:#1c0b0a;color:#ff8a7d;text-shadow:0 0 6px rgba(255,90,70,.6)}
  .gauges{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .gauge{background:#101310;border:2px solid #000;border-radius:4px;padding:8px 10px}
  .gauge .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--yellow)}
  .slip{background:var(--paper);color:var(--ink);padding:12px 14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;min-height:120px;transform:rotate(-.4deg);
        clip-path:polygon(0 0,100% 0,100% 100%,97% calc(100% - 6px),94% 100%,91% calc(100% - 6px),88% 100%,85% calc(100% - 6px),82% 100%,79% calc(100% - 6px),76% 100%,73% calc(100% - 6px),70% 100%,67% calc(100% - 6px),64% 100%,61% calc(100% - 6px),58% 100%,55% calc(100% - 6px),52% 100%,49% calc(100% - 6px),46% 100%,43% calc(100% - 6px),40% 100%,37% calc(100% - 6px),34% 100%,31% calc(100% - 6px),28% 100%,25% calc(100% - 6px),22% 100%,19% calc(100% - 6px),16% 100%,13% calc(100% - 6px),10% 100%,7% calc(100% - 6px),4% 100%,0 calc(100% - 6px))}
  .slip .lab{color:#777;margin-bottom:4px;display:block}
  .slip em{font-style:normal;background:var(--yellow);padding:0 3px}
  /* chave protegida */
  .guard{display:flex;align-items:center;gap:22px;background:repeating-linear-gradient(135deg,var(--yellow) 0 14px,#111 14px 28px);padding:10px;border:3px solid #000;border-radius:6px}
  .guard .inner{flex:1;background:var(--panel);border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:22px}
  .switchbox{position:relative;width:96px;height:96px;flex:none}
  .base{position:absolute;inset:14px 18px;background:#0a0c0a;border:3px solid #000;border-radius:8px}
  .lever{position:absolute;left:50%;width:16px;height:56px;margin-left:-8px;background:linear-gradient(90deg,#9aa39a,#e8ece6,#9aa39a);border-radius:8px;border:2px solid #000;bottom:36px;transform-origin:50% 100%;transform:rotate(-24deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1);z-index:1;cursor:not-allowed}
  .lever::after{content:"";position:absolute;top:-8px;left:-4px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b7bfb7 60%,#555)}
  .switchbox.armed .lever{cursor:pointer}
  .switchbox.fired .lever{transform:rotate(24deg);cursor:default}
  .cover{position:absolute;inset:0;background:rgba(239,59,45,.78);border:3px solid #7a1a12;border-radius:8px;transform-origin:50% 0;transition:transform .3s;cursor:pointer;z-index:2;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;color:#fff;text-transform:uppercase;text-align:center;padding:6px}
  .switchbox.open .cover{transform:perspective(200px) rotateX(-115deg);pointer-events:none}
  .switchbox.sealed .cover{background:rgba(60,64,60,.9);border-color:#000;cursor:not-allowed}
  .gtxt{font-family:var(--f);font-weight:800;font-size:22px;text-transform:uppercase;font-stretch:condensed;line-height:1.05}
  .gtxt small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.08em;color:var(--mute);margin-top:4px;text-transform:none}
  @media(max-width:860px){.work{grid-template-columns:1fr}.gauges{grid-template-columns:1fr 1fr 1fr}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="rack">
  <div class="ann">
    <div class="title">CFTV Agent · Cabine</div>
    <div class="lamp g"><i></i>API</div>
    <div class="lamp g"><i></i>ServiceNow</div>
    <div class="lamp off"><i></i>LLM</div>
    <div class="lamp a" id="lampDry"><i></i>Dry-run</div>
    <div class="lamp off" id="lampSent"><i></i>Despachado</div>
    <div class="lamp off" id="lampBlock"><i></i>Bloqueio</div>
    <div class="keysw"><span class="lab">Modo</span><div class="pos"><span class="on">DRY-RUN</span><span class="lockedpos" title="Desabilitado neste protótipo">GRAVAR</span></div></div>
  </div>
  <div class="work">
    <aside class="printer">
      <span class="lab">Impressora · fila (<span id="left">5</span>)</span>
      <div class="slot"></div>
      <div id="strips" style="display:grid;gap:12px"></div>
    </aside>
    <section class="desk">
      <div class="lcd" id="lcd"></div>
      <div class="gauges">
        <div class="gauge"><span class="lab">Confiança</span><div class="v" id="gConf"></div></div>
        <div class="gauge"><span class="lab">RITM</span><div class="v" id="gRitm"></div></div>
        <div class="gauge"><span class="lab">Origem</span><div class="v" style="font-size:16px;padding-top:8px">REGRAS</div></div>
      </div>
      <div class="slip" id="slip"></div>
      <div class="guard"><div class="inner">
        <div class="switchbox" id="sw"><div class="base"></div><div class="lever" id="lever"></div><div class="cover" id="cover">Tampa<br>de proteção</div></div>
        <div class="gtxt" id="gtxt"></div>
      </div></div>
    </section>
  </div>
</div>
<script>
const INC=[
 {id:'INC4003560',t:'Servidor sem conexão',loc:'Jaboatão',grp:'AMS-TI-CFTV-JAB',conf:100,ritm:'NÃO',patch:[['state','2'],['assignment_group','ac7a11d0…1946'],['short_description','Jaboatão - [CFTV] - Servidor sem conexão','!'],['category','network'],['cmdb_ci','ca5ddf09…193b'],['work_notes','Encaminhado para equipe.']],note:'Título fora do padrão: confira.'},
 {id:'INC9000001',t:'Câmera PIR064 sem imagem',loc:'Piracicaba',grp:'AMS-TI-CFTV-PIR',conf:100,ritm:'NÃO',patch:[['state','2'],['assignment_group','287a11d0…5955'],['short_description','Piracicaba - Câmera PIR064 sem conexão'],['category','network'],['cmdb_ci','5a5ddf09…a9a9'],['work_notes','Encaminhado para equipe.']]},
 {id:'INC9000008',t:'Servidor não comunica com SCOM',loc:'Projects',grp:'AMS-TI-CFTV-PRJ',conf:100,ritm:'NÃO',patch:[['state','2'],['assignment_group','a49b56af…3c7d'],['título / categoria','preservados'],['work_notes','Encaminhado para equipe.']],note:'Alerta SCOM: validar por ping antes.'},
 {id:'INC9000007',t:'Câmera tela preta · Itatiaçu',loc:'Serra Azul',grp:null,conf:100,ritm:'NÃO',block:'Serra Azul: só move com o OK explícito do Victor.'},
 {id:'INC9000006',t:'Câmera sem imagem no galpão',loc:null,grp:null,conf:0,ritm:'NÃO',block:'Sem localidade. Nada será movido.'}
];
let cur=0;const $=i=>document.getElementById(i);
function strips(){ $('strips').innerHTML=INC.map((d,i)=>`<button class="strip ${i===cur?'sel':''} ${d.gone?'gone':''}" data-i="${i}"><div class="id">${d.id}</div><div class="t">${d.t}</div><div class="m">${d.loc??'sem localidade'}${d.grp?' → '+d.grp:''}</div></button>`).join('');
  document.querySelectorAll('.strip').forEach(el=>el.onclick=()=>{cur=+el.dataset.i;show()});$('left').textContent=INC.filter(d=>!d.gone).length;}
function show(){const d=INC[cur];strips();const sw=$('sw');sw.className='switchbox'+(d.block?' sealed':'');
  $('lcd').className='lcd'+(d.block?' bad':'');
  $('lcd').innerHTML=`<div class="lab" style="color:inherit;opacity:.7">${d.id}</div><div class="big">${d.loc??'SEM LOCALIDADE'} ${d.grp?'→ '+d.grp.replace('AMS-TI-CFTV-',''):''}</div><div class="sm">${d.t}<br>${d.block?d.block:'Sugestão pronta. Confira o comprovante e vire a chave.'}</div>`;
  $('gConf').textContent=d.conf+'%';$('gRitm').textContent=d.ritm;
  $('slip').innerHTML=`<span class="lab">Comprovante · PATCH único (nada é gravado em dry-run)</span>`+(d.block?`<em>${d.block}</em>`:d.patch.map(([k,v,w])=>`${k}: ${w?'<em>'+v+'</em>':v}`).join('<br>')+(d.note?`<br><em>! ${d.note}</em>`:''));
  $('gtxt').innerHTML=d.block?`Chave lacrada<small>Sem destino seguro. Ajuste a regra ou dê o OK fora deste painel.</small>`:`Despachar<small>1) levante a tampa · 2) vire a chave</small>`;
  $('lampSent').className='lamp off';$('lampBlock').className='lamp '+(d.block?'r':'off');}
$('cover').onclick=()=>{const d=INC[cur];if(d.block)return;$('sw').classList.add('open','armed')};
$('lever').onclick=()=>{const sw=$('sw'),d=INC[cur];if(!sw.classList.contains('armed')||sw.classList.contains('fired'))return;
  sw.classList.add('fired');$('lampSent').className='lamp g';$('gtxt').innerHTML=`Despachado<small>${d.id} → ${d.grp} (simulado, dry-run)</small>`;
  setTimeout(()=>{d.gone=true;const n=INC.findIndex(x=>!x.gone);cur=n<0?0:n;if(n>=0)show();else{strips();$('lcd').innerHTML='<div class="big">FILA ZERADA</div><div class="sm">Nada pendente.</div>';$('slip').innerHTML='';$('gtxt').innerHTML='Aguardando novos incidentes'}},1300)};
show();
</script>
</body>
</html>
